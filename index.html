<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="display-3 mb-4">Cadastro</h1>
        <div class="mb-4">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" placeholder="Nome" id="nome" class="form-control" />
        </div>
        <div class="mb-4">
            <label for="email" class="form-label">Email</label>
            <input type="email" placeholder="nome@exemplo.com" id="email" class="form-control" />
        </div>
        <div class="mb-4">
            <label for="tel" class="form-label">Telefone</label>
            <input type="tel" placeholder="(00) 00000-0000" id="tel" class="form-control" />
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
